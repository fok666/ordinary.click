name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:
    inputs:
      invalidate_images:
        description: 'Also invalidate cached images (full /* invalidation)'
        type: boolean
        default: false

permissions:
  id-token: write   # required for OIDC
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  SITE_BUCKET: ordinary-click-site
  DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
  DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync site to S3
        run: |
          aws s3 sync site/ "s3://${SITE_BUCKET}/" \
            --delete \
            --cache-control "public,max-age=300" \
            --exclude "*.html"
          aws s3 sync site/ "s3://${SITE_BUCKET}/" \
            --cache-control "public,max-age=60" \
            --exclude "*" --include "*.html"

      - name: Invalidate CloudFront (html/js/css)
        run: |
          # CloudFront wildcards are trailing-only, so enumerate the files
          paths=$(cd site && find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) | sed 's|^\.||')
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths $paths "/"

      - name: Invalidate CloudFront (images)
        if: inputs.invalidate_images
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"

